[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-pilot"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
  "elesim-protocol==0.3.0",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "shapely>=2.0,<3",
  "PyYAML>=6,<7",
  "opencv-contrib-python>=4.8,<4.12",
]

[project.optional-dependencies]
perception = ["ultralytics>=8.0", "pyrealsense2>=2.54"]
test = ["pytest>=8,<9"]

[project.scripts]
elesim-pilot = "elesim_pilot.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elesim_pilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
