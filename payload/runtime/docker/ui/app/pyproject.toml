[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-ui"
version = "0.3.0"
requires-python = ">=3.10"
dependencies = [
  "elesim-protocol==0.3.0",
  "PyYAML>=6,<7",
  "numpy>=1.26,<3",
  "glfw>=2.8",
  "imgui[glfw]>=2.0",
  "PyOpenGL>=3.1",
  "aiortc>=1.9,<2",
  "av>=12,<16",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
elesim-ui = "elesim_ui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["elesim_ui*"]

[tool.setuptools.package-data]
elesim_ui = ["fonts/**/*.ttf", "fonts/**/*.otf"]
