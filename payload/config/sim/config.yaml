schema_version: 1
extends: null

# ``pc`` keeps the native Genesis viewer for local development.  The
# installer selects ``remote`` for a headless compute host and ``jetson`` for
# a hardware-only profile; all three use this same file.
mode: pc

profiles:
  pc:
    simulation:
      runtime:
        use_gpu: true
        enable_viewer: true

  # Remote compute profile: render both network cameras without opening a
  # local Genesis desktop viewer on the simulation host.
  remote:
    simulation:
      runtime:
        use_gpu: true
        enable_viewer: false
      cameras:
        hand_eye:
          enable: true
          # Two synchronous Genesis render passes at 30+20 Hz consume more
          # than one wall second per simulated second on the target renderer.
          # The remote profile favors stable fresh frames over queued cadence.
          max_hz: 10.0
        observer:
          enable: true
          max_hz: 10.0

  # Jetson/native profile: no desktop viewer or network camera rendering.
  jetson:
    simulation:
      runtime:
        use_gpu: false
        enable_viewer: false
      cameras:
        hand_eye:
          enable: false
        observer:
          enable: false

# ---- Shared application defaults -----------------------------------------
simulation:
  physics:
    dt: 0.02
    substeps: 1
    realtime: true
    realtime_factor: 1.0
    gravity: [0.0, 0.0, 0.0]
    roll_rate: .inf
    bend_rate: .inf
  runtime:
    use_gpu: true
    camera_gpu_convert: true
    # Camera rendering runs in a visual-only Genesis process.  The legacy
    # synchronous path is diagnostic-only and must be selected explicitly.
    camera_execution: async_process
    camera_worker_start_timeout_s: 180.0
    # Genesis may spend several seconds on the first EGL render after scene
    # build.  Readiness waits for that first frame without blocking physics.
    camera_first_frame_timeout_s: 30.0
    enable_viewer: true
    # Keep the local Genesis viewer useful without forcing a visualizer/GPU
    # synchronization on every physics step.  Zero restores legacy behavior.
    visualizer_max_hz: 30.0
    # DDS telemetry is a latest-only state snapshot. It does not need to force
    # four synchronous Genesis readbacks on every 50 Hz physics step.
    telemetry_max_hz: 20.0
    floor: true
    use_hardware: false
    use_go2: true
  assembly:
    build_dir: ../../data/models/assemblies/zed-mini
    assy_build_json: blueprint.json
    urdf_name: robot.urdf
    arm_urdf_name: arm.urdf
  cameras:
    hand_eye:
      profile: zed_mini
      config: ../../data/calibration/cameras/zed_mini.hand_eye.json
      enable: true
      jpeg: true
      jpeg_quality: 75
      rgb: true
      depth: true
      max_hz: 30.0
      width: 640
      height: 480
      fov_deg: 60.0
    observer:
      enable: true
      jpeg: true
      jpeg_quality: 85
      max_hz: 20.0
      width: 640
      height: 480
      # Genesis 1.2.x ViewerOptions defaults, in its right-handed Z-up world.
      fov_deg: 40.0
      pos: [3.5, 0.5, 2.5]
      lookat: [0.0, 0.0, 0.5]
  performance:
    log_enable: true
    log_interval_s: 2.0
    log_path: ''

robot:
  arm:
    mapping:
      command_direction: [1, 1, 1, -1]
      linear_u_max_deg: 250.0
      linear_u_limit_deg: 250.0
    model:
      roll_min_deg: -90.0
      roll_max_deg: 90.0
      bend_deg: 36.0
    spawn:
      pitch: 0.05
      n_seg: null
      xyz: [0.0, 0.0, 0.0]
      euler_deg: [0.0, 0.0, 0.0]
    urdf:
      robot_name: Robot
      default_effort: 200.0
      default_velocity: 3.0
      revolute_effort: null
      revolute_velocity: null
      prismatic_effort: null
      prismatic_velocity: null
      revolute_damping: 0.12
      revolute_friction: 0.06
      prismatic_damping: 60.0
      prismatic_friction: 20.0
      mesh_basename_only: false
      colors:
        go2_base: [0.4392, 0.4392, 0.4392, 1.0]
        go2_hip: [0.4392, 0.4392, 0.4392, 1.0]
        go2_thigh: [0.6902, 0.6902, 0.6902, 1.0]
        go2_calf: [0.6902, 0.6902, 0.6902, 1.0]
        go2_foot: [0.6902, 0.6902, 0.6902, 1.0]
        plate: [0.1882, 0.1882, 0.1882, 1.0]
        housing: [0.0627, 0.0627, 0.0627, 1.0]
        wedge: [0.3137, 0.3137, 0.3137, 1.0]
        gripper_claw_left: [0.6902, 0.6902, 0.6902, 1.0]
        gripper_claw_right: [0.6902, 0.6902, 0.6902, 1.0]
  go2:
    spawn:
      spawn_height: 0.32
      # Body-frame transform from the GO2 base to the arm plate.  Keep this
      # equal to the builder/Pilot mount so the runtime URDF and world spawn
      # share one physical attachment point.
      mount_offset_m: [0.35, 0.0, 0.08]
      spawn_euler_deg: [0.0, 0.0, 0.0]
    teleop:
      vx_mps: 0.45
      vy_mps: 0.6
      wz_radps: 0.8
    locomotion:
      pitch_trim:
        gain_x_forward: 0.0
        gain_x_backward: -0.15
        gain_z: 0.9
        z_ref_m: 0.12
        max_rad: 0.05
      payload:
        enable: true
        mass_kg: 0.0
      mpc:
        leg_kv_damping: 3.0
        # The upstream four-face rectangle permits sqrt(2)*mu diagonally.
        # Keep the simulated surface at 0.8 and optimize conservatively.
        physical_friction: 0.8
        optimization_friction: 0.55
        fz_max_n: 180.0
        joint_armature: 0.01
        joint_damping: 0.1
        joint_frictionloss: 0.2
      general:
        mode: convex_mpc
        gait_hz: 2.2

world:
  target:
    enable: true
    xyz: [0.8, 0.0, 0.2]
    radius: 0.025
    color_rgba: [0.85, 0.15, 0.15, 1.0]
    collision: true
    gravity: false
  debug:
    markers: true
