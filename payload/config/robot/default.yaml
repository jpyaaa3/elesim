schema_version: 5
runtime:
  endpoint_id: robot-go2
  device: /dev/ttyUSB0
  # Empty disables Teensy acquisition. Prefer a stable /dev/serial/by-id/... path.
  imu_device: ""
  use_go2: true
rgbd:
  schema_version: 1
  broker_role: pilot
  source_role: robot
  local_handoff: source-dds-to-pilot
  wire:
    format: encoded-rgbd-v1
    capability: stream.rgbd.broker.v1
    topic: /elesim/pilot_main/rgbd/frame
    latest_only: true
dds:
  system_id: elesim
  node_key: robot-go2
  domain_id: 0
  rmw_implementation: rmw_cyclonedds_cpp
  discovery_mode: multicast
  static_peers: []
  network_interface: tailscale0
  vendor_config: ""
  security_profile: trusted-network
  keystore: ""
  enclave: ""
arm:
  linear_u_max_deg: 259.0
  linear_u_limit_deg: 259.0
  command_direction: [1, 1, 1, -1]
  motor_direction: [1, -1, 1, -1]
  baudrate: 1000000
  current_limit_ma: 2500
  claw_contact_load_permille: 250
  claw_contact_stall_s: 0.05
  claw_stall_position_ticks: 3
  profile_vel_seg1: 60
  profile_acc_seg1: 6
  profile_vel_seg2: 60
  profile_acc_seg2: 6
  profile_vel_claw: 20
  max_linear_m_s: 0.20
  max_roll_rad_s: 3.5
  max_bend_rad_s: 1.0
  claw_open_deg: 340.0
  claw_closed_deg: 230.0
mapping:
  linear_u_max: 259.0
  linear_u_limit: 259.0
  # Design ratio: 1.5 motor degrees per mm; 259 degrees retracts 172.667 mm.
  linear_q_min_m: -0.17266666666666666
  linear_q_max_m: 0.0
  roll_q_min_rad: -1.5707963267948966
  roll_q_max_rad: 1.5707963267948966
  seg1_q_min_rad: -0.6283185307179586
  seg1_q_max_rad: 0.6283185307179586
  seg2_q_min_rad: -0.6283185307179586
  seg2_q_max_rad: 0.6283185307179586
go2:
  enabled: true
  backend: unitree_ros2
  pose_source: sportmodestate
  ros_workspace: /opt/unitree_ros2
  network_interface: eth0
  ros_domain_id: 1
  ipc_socket_path: /run/elesim-unitree/bridge.sock
  ipc_robot_user: elesim
  ipc_bridge_user: elesim-unitree
  ipc_heartbeat_interval_s: 0.1
camera:
  backend: zed
  enabled: true
  topic: /elesim/robot_go2/rgbd/frame
  right_topic: /elesim/robot_go2/rgbd/right
  rotate_180: true
  width: 640
  height: 480
  fps: 30
safety:
  command_deadman_s: 0.5
  monitor_period_s: 0.05
  read_failure_limit: 3
  telemetry_period_s: 0.1
  max_go2_vx_m_s: 0.8
  max_go2_vy_m_s: 0.5
  max_go2_wz_rad_s: 1.5
