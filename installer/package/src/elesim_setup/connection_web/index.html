<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="app.title">Elesim 연결 관리자</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">EL</span><span data-i18n="app.title"></span></div>
    <div class="language-switch" role="group" aria-label="Language">
      <button type="button" data-language="ko">한국어</button>
      <button type="button" data-language="en">English</button>
    </div>
  </header>

  <div id="error-banner" class="banner error" role="alert" hidden>
    <span class="banner-message"></span>
    <button type="button" class="banner-close" data-banner-close data-i18n-aria-label="action.dismiss">×</button>
  </div>
  <div id="notice-banner" class="banner notice" role="status" hidden>
    <span class="banner-message"></span>
    <button type="button" class="banner-close" data-banner-close data-i18n-aria-label="action.dismiss">×</button>
  </div>

  <main>
    <section class="panel" aria-labelledby="graph-heading">
      <div class="section-heading">
        <div><h2 id="graph-heading" data-i18n="graph.title"></h2></div>
      </div>
      <div class="graph-grid">
        <div class="settings-column">
          <label><span data-i18n="mode.title"></span><select id="topology-mode"><option value="full" data-i18n="mode.full"></option><option value="simulation-only" data-i18n="mode.simulation"></option></select></label>
          <label><span data-i18n="graph.discovery"></span><select id="discovery"><option value="multicast" data-i18n="graph.multicast"></option><option value="static" data-i18n="graph.static"></option></select></label>
          <label><span data-i18n="graph.security"></span><select id="security"><option value="trusted-network" data-i18n="graph.trusted"></option><option value="sros2" data-i18n="graph.sros2" selected></option></select></label>
        </div>
        <div class="settings-column">
          <label><span data-i18n="graph.system"></span><input id="system-id" type="text" value="elesim" spellcheck="false"></label>
          <label><span data-i18n="graph.domain"></span><input id="domain-id" type="number" min="0" max="232" value="0"></label>
        </div>
      </div>
    </section>

    <section class="panel" aria-labelledby="hosts-heading">
      <div class="section-heading">
        <div><h2 id="hosts-heading" data-i18n="hosts.title"></h2></div>
      </div>

      <div id="host-grid" class="host-grid">
        <article class="host-card" data-slot="com1">
          <header><div><span class="slot-name">COM1</span></div><label class="unused"><input type="checkbox" data-field="unused"><span data-i18n="host.unused"></span></label></header>
          <div class="unit-lanes">
            <section class="unit-lane runtime-lane"><h3 data-i18n="unit.runtime"></h3><div class="drop-zone" data-drop-slot="com1" data-drop-unit="runtime" aria-label="COM1 runtime roles"></div></section>
          </div>
          <div class="host-fields">
            <label><span data-i18n="host.id"></span><input data-field="host-id" type="text" value="com1" spellcheck="false"></label>
            <label><span data-i18n="dds.address"></span><input data-field="dds-address" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="dds.interface"></span><input data-field="dds-interface" type="text" placeholder="tailscale0" spellcheck="false"></label>
            <label><span data-i18n="install.root"></span><input data-field="install-root" type="text" value="/opt/elesim" spellcheck="false"></label>
            <label><span data-i18n="install.bin"></span><input data-field="bin-dir" type="text" value="/opt/elesim/bin" spellcheck="false"></label>
            <label class="local-choice"><input type="radio" name="local-host" value="com1" checked><span data-i18n="host.local"></span></label>
          </div>
          <details class="ssh-fields" open><summary data-i18n="ssh.title"></summary><label class="ssh-tailscale-choice"><input data-field="ssh-tailscale" type="checkbox"><span data-i18n="ssh.tailscale"></span></label><div class="host-fields">
            <label><span data-i18n="ssh.host"></span><input data-field="ssh-host" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="ssh.port"></span><input data-field="ssh-port" type="number" min="1" max="65535" value="22"></label>
            <label><span data-i18n="ssh.user"></span><input data-field="ssh-user" type="text" value="elesim"></label>
            <label><span data-i18n="ssh.key"></span><input data-field="ssh-key" type="text" spellcheck="false"></label>
            <label class="wide"><span data-i18n="ssh.fingerprint"></span><input data-field="ssh-fingerprint" type="text" readonly spellcheck="false"></label>
          </div><button type="button" class="probe" data-probe-slot="com1" data-i18n="action.probe"></button></details>
        </article>

        <article class="host-card" data-slot="com2">
          <header><div><span class="slot-name">COM2</span></div><label class="unused"><input type="checkbox" data-field="unused"><span data-i18n="host.unused"></span></label></header>
          <div class="unit-lanes">
            <section class="unit-lane runtime-lane"><h3 data-i18n="unit.runtime"></h3><div class="drop-zone" data-drop-slot="com2" data-drop-unit="runtime" aria-label="COM2 runtime roles"></div></section>
          </div>
          <div class="host-fields">
            <label><span data-i18n="host.id"></span><input data-field="host-id" type="text" value="com2" spellcheck="false"></label>
            <label><span data-i18n="dds.address"></span><input data-field="dds-address" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="dds.interface"></span><input data-field="dds-interface" type="text" placeholder="tailscale0" spellcheck="false"></label>
            <label><span data-i18n="install.root"></span><input data-field="install-root" type="text" value="/opt/elesim" spellcheck="false"></label>
            <label><span data-i18n="install.bin"></span><input data-field="bin-dir" type="text" value="/opt/elesim/bin" spellcheck="false"></label>
            <label class="local-choice"><input type="radio" name="local-host" value="com2"><span data-i18n="host.local"></span></label>
          </div>
          <details class="ssh-fields" open><summary data-i18n="ssh.title"></summary><label class="ssh-tailscale-choice"><input data-field="ssh-tailscale" type="checkbox"><span data-i18n="ssh.tailscale"></span></label><div class="host-fields">
            <label><span data-i18n="ssh.host"></span><input data-field="ssh-host" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="ssh.port"></span><input data-field="ssh-port" type="number" min="1" max="65535" value="22"></label>
            <label><span data-i18n="ssh.user"></span><input data-field="ssh-user" type="text" value="elesim"></label>
            <label><span data-i18n="ssh.key"></span><input data-field="ssh-key" type="text" spellcheck="false"></label>
            <label class="wide"><span data-i18n="ssh.fingerprint"></span><input data-field="ssh-fingerprint" type="text" readonly spellcheck="false"></label>
          </div><button type="button" class="probe" data-probe-slot="com2" data-i18n="action.probe"></button></details>
        </article>

        <article class="host-card disabled" data-slot="com3">
          <header><div><span class="slot-name">COM3</span></div><label class="unused"><input type="checkbox" data-field="unused" checked><span data-i18n="host.unused"></span></label></header>
          <div class="unit-lanes">
            <section class="unit-lane runtime-lane"><h3 data-i18n="unit.runtime"></h3><div class="drop-zone" data-drop-slot="com3" data-drop-unit="runtime" aria-label="COM3 runtime roles"></div></section>
          </div>
          <div class="host-fields">
            <label><span data-i18n="host.id"></span><input data-field="host-id" type="text" value="com3" spellcheck="false"></label>
            <label><span data-i18n="dds.address"></span><input data-field="dds-address" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="dds.interface"></span><input data-field="dds-interface" type="text" placeholder="tailscale0" spellcheck="false"></label>
            <label><span data-i18n="install.root"></span><input data-field="install-root" type="text" value="/opt/elesim" spellcheck="false"></label>
            <label><span data-i18n="install.bin"></span><input data-field="bin-dir" type="text" value="/opt/elesim/bin" spellcheck="false"></label>
            <label class="local-choice"><input type="radio" name="local-host" value="com3"><span data-i18n="host.local"></span></label>
          </div>
          <details class="ssh-fields" open><summary data-i18n="ssh.title"></summary><label class="ssh-tailscale-choice"><input data-field="ssh-tailscale" type="checkbox"><span data-i18n="ssh.tailscale"></span></label><div class="host-fields">
            <label><span data-i18n="ssh.host"></span><input data-field="ssh-host" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="ssh.port"></span><input data-field="ssh-port" type="number" min="1" max="65535" value="22"></label>
            <label><span data-i18n="ssh.user"></span><input data-field="ssh-user" type="text" value="elesim"></label>
            <label><span data-i18n="ssh.key"></span><input data-field="ssh-key" type="text" spellcheck="false"></label>
            <label class="wide"><span data-i18n="ssh.fingerprint"></span><input data-field="ssh-fingerprint" type="text" readonly spellcheck="false"></label>
          </div><button type="button" class="probe" data-probe-slot="com3" data-i18n="action.probe"></button></details>
        </article>

        <article class="host-card disabled" data-slot="com4">
          <header><div><span class="slot-name">Jetson</span></div></header>
          <div class="unit-lanes">
            <section class="unit-lane runtime-lane"><h3 data-i18n="unit.runtime"></h3><div class="drop-zone" data-drop-slot="com4" data-drop-unit="runtime" aria-label="COM4 runtime roles"></div></section>
            <section class="unit-lane robot-lane"><h3 data-i18n="unit.robot"></h3><div class="drop-zone" data-drop-slot="com4" data-drop-unit="robot" aria-label="COM4 Robot role"></div></section>
          </div>
          <div class="host-fields">
            <label><span data-i18n="host.id"></span><input data-field="host-id" type="text" value="com4" spellcheck="false"></label>
            <label><span data-i18n="dds.address"></span><input data-field="dds-address" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="dds.interface"></span><input data-field="dds-interface" type="text" placeholder="tailscale0" spellcheck="false"></label>
            <label><span data-i18n="install.root"></span><input data-field="install-root" type="text" value="/opt/elesim" spellcheck="false"></label>
            <label><span data-i18n="install.bin"></span><input data-field="bin-dir" type="text" value="/opt/elesim/bin" spellcheck="false"></label>
            <label class="local-choice"><input type="radio" name="local-host" value="com4"><span data-i18n="host.local"></span></label>
          </div>
          <details class="ssh-fields" open><summary data-i18n="ssh.title"></summary><label class="ssh-tailscale-choice"><input data-field="ssh-tailscale" type="checkbox"><span data-i18n="ssh.tailscale"></span></label><div class="host-fields">
            <label><span data-i18n="ssh.host"></span><input data-field="ssh-host" type="text" placeholder="100.x.y.z" spellcheck="false"></label>
            <label><span data-i18n="ssh.port"></span><input data-field="ssh-port" type="number" min="1" max="65535" value="22"></label>
            <label><span data-i18n="ssh.user"></span><input data-field="ssh-user" type="text" value="elesim"></label>
            <label><span data-i18n="ssh.key"></span><input data-field="ssh-key" type="text" spellcheck="false"></label>
            <label class="wide"><span data-i18n="ssh.fingerprint"></span><input data-field="ssh-fingerprint" type="text" readonly spellcheck="false"></label>
          </div><button type="button" class="probe" data-probe-slot="com4" data-i18n="action.probe"></button></details>
        </article>
      </div>
    </section>

    <section class="panel actions" aria-labelledby="actions-heading">
      <div class="actions-heading"><h2 id="actions-heading" data-i18n="actions.title"></h2></div>
      <div class="workflow-layout">
        <div class="workflow-steps">
          <article class="workflow-step" data-step="save" data-state="pending" data-enabled="true">
            <div class="step-number">1</div>
            <div><h3 data-i18n="workflow.save.title"></h3></div>
            <button id="save" type="button" data-i18n="action.save"></button>
          </article>
          <article class="workflow-step" data-step="apply" data-state="pending" data-enabled="false">
            <div class="step-number">2</div>
            <div><h3 data-i18n="workflow.apply.title"></h3></div>
            <button id="apply" type="button" disabled></button>
          </article>
          <article class="workflow-step" data-step="login" data-state="pending" data-enabled="false">
            <div class="step-number">3</div>
            <div><h3 data-i18n="workflow.login.title"></h3></div>
            <button id="tailscale-login" type="button" data-i18n="action.tailscale.login" disabled></button>
          </article>
          <article class="workflow-step" data-step="start" data-state="pending" data-enabled="false">
            <div class="step-number">4</div>
            <div><h3 data-i18n="workflow.start.title"></h3></div>
            <button id="runtime-start" type="button" data-i18n="action.start" disabled></button>
          </article>
        </div>
        <div class="abort-step"><button id="cancel" type="button" class="danger-button" data-i18n="action.cancel" disabled></button></div>
      </div>
      <div class="host-status"><strong data-i18n="runtime.title"></strong><pre id="runtime-status">—</pre></div>
      <div class="job-status">
        <strong id="job-status" data-i18n="job.idle"></strong>
        <pre id="job-log"></pre>
      </div>
    </section>
  </main>
</body>
</html>
