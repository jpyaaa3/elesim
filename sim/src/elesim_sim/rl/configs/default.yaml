# Wrap-grasp RL configuration.  Every tunable lives here; the code must not
# hardcode any of these values.  Sections map 1:1 onto the dataclasses in
# `elesim_sim.rl.configs.loader`.
schema_version: 1

runtime:
  # Genesis compute backend.  "gpu" resolves to CUDA on Linux and Metal on
  # macOS; "cpu" is the portable fallback.  Nothing here assumes NVIDIA.
  backend: gpu
  # Torch device for the policy.  "auto" picks cuda -> mps -> cpu.
  torch_device: auto
  n_envs: 256
  seed: 0
  # Torch deterministic algorithms.  Slower; use for reproduction runs.
  deterministic: false

scene:
  dt: 0.01
  # Genesis rigid-solver substeps per scene.step().
  solver_substeps: 1
  # Contact-constraint buffer.  Genesis halts the sim if the real pair count
  # exceeds this, and get_contacts() returns at most this many rows per env.
  #
  # Measured across a grid of wrapping poses, the worst single env held 27
  # contacts and the buffer never exceeded 29 rows, so 512 already had ample
  # headroom.  Raised anyway for margin, but note this is *not* what caused the
  # run to die: exceeding the buffer halts with its own message, whereas the
  # failure was "Invalid constraint forces causing 'nan'", i.e. the solver
  # diverging.  That one scales with environment count, not buffer size.
  max_collision_pairs: 1024
  show_viewer: false
  # The mechanism's own parameters are read from here.
  app_config: sim/config/config.yaml
  # Convex-decomposition threshold for the robot's collision meshes.
  #
  # Genesis defaults this to infinity for robots, which means no decomposition
  # ever runs and every link collapses to a single convex hull.  For the nodes
  # that is harmless -- they are already convex, hull volume equals mesh volume.
  # For the gripper it is not: the open jaw gets filled in, inflating
  # gripper_base by 330% and the claws by 59%, and it was gripper-to-housing
  # contact that capped the reachable wrap angle.  A finite threshold lets CoACD
  # split concave links into several convex pieces instead.  Costs build time.
  # Set to null to keep the Genesis default.
  decompose_robot_error_threshold: 0.15
  # Empty -> resolved relative to the repo root (model/bundles/default).
  model_bundle: ""
  urdf_relpath: robot.urdf
  floor: true
  # Spacing between adjacent parallel environments, metres.  Visualisation
  # only: Genesis keeps entity positions in each env's own frame and applies
  # this as a drawing offset, so nothing the policy or the reward sees changes.
  #
  # It has to be non-zero or every env is drawn at the same place and a
  # recorded video shows all of them stacked on top of each other.  At 3 m the
  # next env still appears in the corner of the eval camera's frame; 6 m puts
  # it outside, so the recording shows env 0 alone.  The floor is an infinite
  # plane, so spacing costs nothing.
  env_spacing_m: [6.0, 6.0]
  # null keeps whatever the URDF/Genesis default is.  Set to override.
  friction: null
  go2:
    enable: true
    # null -> the application config's go2_spawn_height.  Taking it from the
    # schema default instead gave 0.42 against the app's actual 0.32.
    spawn_xyz: null
    # The quadruped is scenery for wrap grasping: freeze the legs so they
    # cannot walk away mid-episode, and treat the trunk as a collision body.
    freeze_legs: true
    # Weld the trunk to the world.  Wrap grasping is not a locomotion task
    # and a toppling base would inject failures that have nothing to do with
    # the policy under test.
    base_fixed: true
    # Held leg pose, in radians, as (hip, thigh, calf) repeated per leg.
    leg_pose_rad: [0.0, 0.9, -1.8]

arm:
  # Joint names come from the bundle URDF.  Segment 1 is the proximal five
  # bend nodes, segment 2 the distal five.
  linear_joint: j_plate_housing
  roll_joint: j_housing_wedge
  bend_joints:
    - j_wedge_node0
    - j_node0_node1
    - j_node1_node2
    - j_node2_node3
    - j_node3_node4
    - j_node4_node5
    - j_node5_node6
    - j_node6_node7
    - j_node7_node8
    - j_node8_node9
  n_seg: 5
  # Sign conventions mirror runtime.JointLayout.
  linear_axis_sign: 1.0
  roll_axis_sign: 1.0
  # +1, not the -1 that runtime.JointLayout uses.  Waypoints here are already
  # in the canonical q convention that control_u_to_sim_q produces, so applying
  # the runtime's extra negation flips the bend and folds the arm through the
  # quadruped's own body: the UI's Home preset came out with 74 mm of
  # penetration at 495 N instead of resting clear.
  bend_axis_sign: 1.0
  # Reset pose, taken from the UI's Home preset so training starts where the
  # real arm starts.  The preset is u_linear=180, u_roll=180, u_s1=u_s2=10 in
  # slider units (pilot.pick.actions.home_controls), which
  # elesim_protocol.messages.control_u_to_sim_q maps to these physical values:
  # the arm folded almost to its per-node limit, not straight out.
  # Reset pose: a named UI preset, converted through the app's own u-space
  # mapping.  Set home_waypoint explicitly to override.
  home_preset: home
  home_waypoint: null
  # null on any limit means: read it from the application config.
  limits:
    linear_m: null
    roll_rad: null
    bend_per_node_rad: null
    # Coupled cap keeping the grossest self-folds out of the action space:
    #
    #     |theta1_curl_weight * theta1 + theta2| <= curl_limit_per_node_rad
    #
    # Unlike the three above these are not mechanism parameters, so they are
    # numbers here rather than null -- they are a self-collision boundary
    # measured in the built scene.
    #
    # The backbone reaches its own housing when both segments curl the same way
    # far enough.  Swept over a 9x9 (theta1, theta2) grid with the object parked
    # away, every folding cell and every clean one is separated exactly by
    # 1.5*theta1 + theta2 > 60 deg per node.  Not by the plain sum: (24, 24) is
    # clean at 48 while (30, 18) folds at the same 48, because segment 1 is the
    # one that swings back towards the base.  Opposite signs -- the S shape --
    # never fold, and the signed form handles that without a special case.
    theta1_curl_weight: 1.5
    # Cap on how far the two segments may curl the same way at once.  Its only
    # job is to keep the deep self-folds out of the action space.
    #
    # Measured statically -- joints written directly, so the pose is the only
    # variable -- the backbone reaches its own housing at curl 52 deg for
    # roll 0, 54 for +/-45 and 61 for +/-90.  Curl is the variable; roll shifts
    # the threshold by about 10 deg, and an earlier roll-gated version of this
    # cap, built on measurements that drove the arm to each pose and so
    # measured the path as much as the pose, was dropped.
    #
    # No cap can do more than this.  Wrapping needs curl 58.5, which in free
    # space folds at every roll bar +/-90 and is marginal even there, so a cap
    # that forbids the fold also forbids the wrap: what makes the wrap pose
    # safe is the object holding the coil open, and that is a contact
    # condition.  61 deg is the smallest value that still wraps the 90 mm
    # cylinder -- at 60 that corner fails -- and it blocks everything past it.
    #
    # Keeping the fold out of what the policy actually does is
    # reward.self_contact's job, and getting it to surround the object before
    # closing on it is enclosure_progress's.
    #
    # null disables the cap.
    curl_limit_per_node_rad: 1.0647     # 61 deg
  gains:
    kp: 200.0
    kv: 20.0
    force_range: 100.0
  # Link names used for coverage and approach shaping.
  segment2_mid_link: node7
  # Links that must never touch anything but the object.
  arm_link_prefixes: [node, wedge, housing, gripper]

# The cylinder stands on a support, not on the ground.  The workspace probe
# (sim/benchmarks/workspace.md) measured a peak wrap of 86 deg for a
# floor-standing cylinder against 272 deg once the height restriction was
# lifted: the floor is what stops the arm closing underneath the object.  A
# raised support is also the realistic case for a quadruped-mounted arm.
support:
  # Off: the object now stands on the floor.
  #
  # A post under the object is unavoidably inside the wrap.  The coil forms in
  # a horizontal plane at z = 0.559 and the post has to reach up to meet the
  # object from below, so it occupies the volume the arm swings through: driven
  # at the wrap pose, the gripper brushes the column at z = 0.36-0.42 on the
  # way in and the episode ends in `collision` before the arm ever reaches the
  # object.  Narrowing the post trades that for toppling, which is what the
  # it300 evaluation measured.  A cylinder tall enough to stand on the ground
  # removes the obstacle instead of shrinking it, and anything the arm meets
  # down there is then the target.
  enable: false
  # Top surface height; the object centre sits half its height above this.
  # 0.459 puts the cylinder's mid-height at z = 0.559, the plane the coil forms
  # in.  The post top stays 0.10 m below the arm, so it is not in the way.
  height_m: 0.459
  # Half-extents of the support box.  Wide enough to actually carry the
  # object: the randomisation range goes to a 120 mm cylinder, and a post
  # narrower than that leaves it balanced on an overhang, so the lightest touch
  # tips it.  That is what the it300 evaluation was measuring -- topple rates
  # tracked object radius monotonically (35 mm: survives; 45 mm and 60 mm:
  # ~100% topple within a few steps), which is the signature of the stand, not
  # of the policy.
  #
  # Widening costs almost nothing in arm clearance, because the post ends
  # 100 mm below the plane the coil forms in: measured over a pose sweep,
  # collisions rise only from 190/525 at 40 mm to 206/525 at 120 mm.  The
  # earlier 40 mm choice came from a sweep taken while bend_axis_sign was
  # inverted, where the arm was passing through the quadruped and the support
  # attribution was meaningless.
  half_extents_xy: [0.065, 0.065]
  # The coil's own centre, not a position picked for the object.
  #
  # The earlier (0.500, -0.075) came from a placement search scored on
  # proximity, which credits an arm that merely encircles the object with
  # clearance.  Driven in physics that column produced two contacts at best:
  # the coil closed around a point 250 mm from where the object was standing,
  # so the arm could only reach it with its tip, and a hook is the only thing
  # a policy can learn there.
  #
  # This is the centre of the largest circle that fits inside the closed coil
  # while staying enclosed by it, for the pose linear = -0.077 m, roll = +90
  # deg, theta1 = 18 deg/node, theta2 = 36 deg/node -- mid-range on the linear
  # axis, so the policy has 77 mm of travel either way.  Driven in physics from
  # an open pose the arm closes on a 45 mm cylinder here with 3 contacts and a
  # 174 deg contact-anchored wrap, displacing the object 6 mm.  Both y signs
  # work by mirror symmetry.
  center_xy: [0.368, 0.160]

object:
  kind: cylinder
  # Sized to the coil, not to the stand.  The inner clearance of the closed
  # coil is what decides whether the links reach the surface at all: measured
  # at the column position below, a 35 mm cylinder draws a single contact and a
  # zero wrap, while 45/50/55/60 mm draw 3/5/5/4 contacts for 174/196/188/206
  # deg.  50 mm sits in the middle of what closes.
  radius_m: 0.050
  # Tall enough to stand on the floor and still cross the plane the coil forms
  # in, so no support is needed under it.  A pipe or post is the canonical
  # whole-arm wrap target anyway.
  #
  # The arm's links occupy z = 0.541-0.590 at the wrap pose, so the object has
  # to reach 0.59 m.  At 1.1 m it is grasped near its mid-height, which keeps a
  # lateral pull translating the object rather than levering it about its base.
  height_m: 1.1
  # Bounded by what the arm can carry, not by what a 1.1 m x 100 mm cylinder
  # would weigh if it were solid.  Mass matters twice here: a heavier object
  # resists being shoved during the approach, and the tug force is a multiple
  # of its weight, so heavier is also a harder retention test.
  mass_kg: 0.30
  # Cylinder centre at reset.  With no support this has to be explicit; x and y
  # are the coil's own centre for the wrap pose (see the support block), and z
  # is half the height, seating it on the floor.
  pos_xyz: [0.368, 0.160, 0.550]
  collision: true
  # A graspable object must be a free body: disturbance and topple checks are
  # meaningless for a fixed entity.
  fixed: false

macro_step:
  # Rule 1: this is a macro-step MDP, not a 50 Hz reactive controller.
  max_steps: 15
  # Substeps simulated per macro step.
  substeps: 40
  # Fraction of those substeps spent *moving* to the new waypoint, with the
  # joint target interpolated across them; the rest is settling.
  #
  # Without this the target jumps by a whole rate limit at the start of the
  # step -- 0.20 rad of roll at once -- and the arm swats the object out of
  # position before the wrap can close: measured 17 mm of object displacement
  # and the wrap collapsing from 252 deg to 16 deg.  The spec's macro step is
  # "move and settle", and this is the move.  It does not change the MDP: the
  # policy still issues one waypoint per macro step.
  move_fraction: 0.6
  settle:
    # "fixed" always runs `substeps`; "velocity" stops early once the arm and
    # object velocities fall under the thresholds for `hold_substeps`.
    mode: fixed
    joint_vel_thresh: 0.05
    object_vel_thresh: 0.02
    hold_substeps: 5
    min_substeps: 10
  # Per-macro-step waypoint increment caps (the action is scaled into these).
  # Per-macro-step waypoint increment caps.
  #
  # Sized so the Home pose can actually reach a wrapping pose inside the
  # episode: from Home, roll has 90 deg to travel and theta2 has 70 deg, and at
  # the old caps that alone cost 8 and 13 of 18 steps, leaving nothing for the
  # approach.  These reach it in about 6, and the interpolation across
  # move_fraction keeps the larger increment from arriving as an impulse.
  rate_limit:
    linear_m: 0.04
    roll_rad: 0.30
    theta_rad: 0.25

beta:
  # Rule 3: interface only.  These are placeholder values from the paper's
  # Table II manual configuration and MUST be replaced with measurements.
  enable: true
  measured: false
  beta0_deg: 0.8
  load_slope_deg_per_kg: 0.66
  # Randomisation of beta0 across envs (uniform, absolute degrees).
  beta0_jitter_deg: 0.2
  # Sign convention: backlash opposes the last commanded direction.
  directional: true
  # The estimator hook models an on-robot beta compensator.  1.0 = perfect
  # compensation in the observation, 0.0 = actor sees the raw corrupted angle.
  estimator_gain: 0.8
  estimator_noise_deg: 0.15
  # The bundle already carries a sag model that runtime.target_from_4dof
  # applies.  Enabling both double-counts deflection, so this is off here.
  apply_bundle_sag_model: false

reward:
  weights:
    coverage_progress: 2.0
    # Bearing span the arm gets around the object, distance-free.  Pays for
    # putting the open coil round the object before closing it, which is the
    # step a graze never becomes a wrap without: with coverage and approach
    # alone the wrap angle plateaus at 27 deg, two adjacent links grazing,
    # because every other signal is a distance and a distance is minimised by
    # poking with the nearest link.  Measured along a scripted wrap the
    # enclosure runs 27 -> 118 deg through the roll and 222 -> 300 as the coil
    # comes round, while an arm extending past the object peaks at 118 and
    # falls back to 92, so the two separate before either touches anything.
    enclosure_progress: 1.0
    approach_shaping: 0.5
    step_cost: -0.05
    non_target_collision: -1.0
    object_disturbance: -0.5
    object_topple: -2.0
    success: 5.0
  # Approach shaping normaliser d0 (metres).
  approach_d0: 0.20
  # Which distance approach_shaping is measured against.
  #
  # `nearest_link` -- the closest arm link to the object surface.
  # `anchor_link`  -- the segment-2 midpoint, which is what it used to be and
  #                   is a bad proxy for "am I getting closer".  The wrap needs
  #                   roll near +/-90 deg to put the bend plane horizontal, and
  #                   that rotation swings the midpoint *away* before the curl
  #                   brings it back: measured along a scripted wrap its
  #                   distance runs 236 -> 250 mm over the six macro steps of
  #                   roll while the arm is doing exactly the right thing.  So
  #                   the term paid -0.5 for the one manoeuvre the task cannot
  #                   be done without, standing still scored better than
  #                   approaching (-0.75 against -0.84), and two runs to
  #                   iteration 300 came back with all 13824 eval episodes
  #                   classified `no_reach`.
  #
  # The nearest link falls monotonically over the same trajectory: 97 -> 78 mm
  # through the roll, then 10 -> 0.9 mm as the coil closes.
  approach_shaping_source: nearest_link
  # Which arm-against-arm contacts count towards non_target_collision, which
  # both penalises and terminates.
  self_contact:
    # Every self contact.  Off, because closing a continuum coil tightly enough
    # to wrap is what makes the coil touch itself: measured on this arm,
    # wrapping a 45-55 mm cylinder raises self contact in the same macro step
    # the wrap reaches 174-188 deg, so counting all of it ends the episode at
    # the moment of success.  Node-against-node folds are already bounded by
    # the 36 deg per-node joint limit.
    all_is_failure: false
    # Self contact involving a link whose name starts with one of these counts
    # even so.  The housing is the rigid base the backbone is mounted on, not
    # part of the coil, so the backbone folding back into it is a genuine crash
    # whatever the wrap angle says.  Matched against the leaf link name.
    #
    # Logged separately as `contact/self_structural` against `contact/self`.
    structural_prefixes: ["housing"]
    # Whether that contact ends the episode as well as costing the penalty.
    #
    # It does.  Driving the backbone into its own base is a fault, not a pose to
    # recover from, and the episode should not continue past it.  Setting this
    # false lets the arm back out and keeps the rest of the rollout, at the cost
    # of treating a crash as survivable; the penalty then applies on every macro
    # step the contact lasts rather than once.
    terminates: true
  # Coverage is measured about the object's *current* centre.
  coverage:
    # Arc-length bin count for the azimuth occupancy histogram.  Coverage is
    # rounded down to a whole bin, so this also sets how much true wrap angle
    # the measurement gives away: 180 bins = 2 deg, matching the resolution of
    # the prior geometry sweep.
    n_bins: 180
    # An arm link counts as occupying its azimuth bin within this radial band
    # around the object surface (metres).  Kept near the node's own in-plane
    # half-size: a band of 0.09 let a link 9 cm clear of the surface score
    # towards the wrap angle, which is how a coil that never touched the object
    # still read 250 deg.
    radial_band_m: 0.04
    # Effective node half-size *in the bending plane*, measured from the
    # collision mesh (model/bundles/default/assets/node/node_mesh.obj).
    #
    # The node is a hexagonal barrel: 50 mm along the chain (the joint pitch),
    # 88 mm across the hinge axis, and 70 mm in the plane it bends in, tapering
    # to a hinge edge at each end so neighbours can rotate without clashing.
    # Only the in-plane 70 mm matters here -- half of it, 35 mm -- because that
    # is what sets how closely a link surface can approach the object as the arm
    # curls around it.
    #
    # The 56.22 mm quoted as the "node capsule radius" in
    # misc/analysis/wrap_grasp is sqrt(44^2 + 35^2): the 3D corner distance,
    # which folds in the width along the hinge axis, a dimension that has no
    # bearing on curling.  Using it overstated the link by 60% and, because the
    # caging test subtracts 2*link_radius from the escape chord, made caging
    # look easier than it is rather than harder.
    link_radius_m: 0.035
    # Tolerance on the interpenetration rejection, in metres.
    interpenetration_tol_m: 0.002
    # What counts as occupying an azimuth bin.
    #
    # `contact_span` -- the near links lying between the first and last link
    #                   that touches the object, and zero below two contacts.
    #                   The arm is anchored on the object at both ends of that
    #                   run and hugs it in between, which is what wrapping is.
    # `contact`      -- only the touching links themselves.  Measured against
    #                   the simulator this is too sharp: a rigid cylinder in a
    #                   continuum coil touches at 2-3 points, because the coil
    #                   is a spiral rather than a circle, so a real 254 deg
    #                   wrap scores 0 whenever those points are not neighbours.
    # `proximity`    -- any link within radial_band_m of the surface.  Credits
    #                   a vertical hook 58 deg against a real coil's 66 deg, a
    #                   margin too small to pay for the six macro steps of roll
    #                   the coil costs, so a policy trained on it learns to
    #                   hook instead of to wrap.
    #
    # Under either contact rule Phi stays at zero until the arm actually
    # touches; the dense signal during approach is approach_shaping's job.
    source: contact_span
    # Caging is always measured and logged; this switch decides whether it also
    # gates the geometric success criterion.
    #
    # It defaults to false because caging and a 172 deg gate are mutually
    # exclusive, not because caging is unimportant.  When a link rests on the
    # object the wrap radius is R = r + link_radius, so an opening spanning a
    # gap of 180 deg or more measures 2R - 2*link_radius = exactly 2r: at half
    # a turn the object slips straight out.  Caging therefore requires strictly
    # more than 180 deg of wrap, which no pose in the prior geometry sweep
    # reached either ("secure wrap not reached anywhere", peak 172 deg).
    #
    # Turning this on makes the geometric gate stricter than the configured
    # coverage target and is only coherent with coverage_target_rad > pi.  The
    # lift test is the real retention check; `caged` is reported alongside the
    # wrap angle so a run can never claim a grasp that geometry says leaks.
    require_caging: false
  disturbance:
    # Displacement here is measured at the end the object stands on, not at its
    # centre, so it means "shoved along the ground" and tipping is left to
    # max_tilt_rad.  Against the centre of a 1.1 m cylinder the two were not
    # separate: tipping by theta moves the centre by 0.55*sin(theta), so the
    # 60 mm gate fired at 6.3 deg of tilt and pre-empted the 34 deg one.  Any
    # contact firm enough to wrap passes through 3 deg, so `topple` fired on
    # every episode that touched the object and the policy learned not to touch
    # it -- 13817 of 13824 eval episodes came back `no_reach`.
    #
    # Continuous penalty is applied to displacement beyond this dead-band.
    deadband_m: 0.005
    # Terminating thresholds.
    max_displacement_m: 0.06
    # 60 deg: where a free-standing cylinder is unambiguously going over.
    #
    # It was 20 deg, and that was cutting episodes off early.  Measured on the
    # stage-1 policy over 1962 episodes, the ones that ended in `topple` did so
    # at macro step 5 of 15 with the wrap only 58 deg along, and 95% of them
    # had never passed 90 deg.  Whether they would have recovered cannot be
    # read off that number -- the gate terminates them, so the observation is
    # censored -- and raising it is the only way to find out.
    #
    # A scripted wrap that succeeds peaks at 3.4 deg, so this leaves the
    # successful trajectory a wide margin.  Shoving is still caught by
    # max_displacement_m, which measures the base and is unaffected by tipping,
    # and a grasp on a leaning object still has to survive the tug test.
    max_tilt_rad: 1.05

success:
  # Success is retention: the wrap has to survive a pull.
  #
  # `tug` holds the wrap still and applies a lateral force through the opening
  # the wrap left, sized as a multiple of the object's own weight, then checks
  # the object's pose relative to segment 2.  It is the default because the
  # cheaper criteria do not answer the question.
  #
  # `geometric` scores the wrap angle against coverage_target_rad, which is a
  # pose, not a grasp -- and the obvious repair, requiring caging, is out of
  # reach on this arm: the coil is a spiral, so it surrounds 184-198 deg of
  # bearing while the widest gap stays 10-20 mm wider than the object at every
  # size in the randomisation range.
  #
  # `lift` is the strictest test but is unreachable here: rolling the arm to
  # lift sweeps it through the space directly under the object.  Training to
  # iteration 2800 under it left `retention: 0` across all 3112 episodes.
  #
  # The dense early signal comes from reward.weights.approach_shaping, which is
  # continuous at any distance; a success bonus does not need to be dense.
  criterion: tug              # tug | geometric | lift
  # Wrap angle past which the object counts as wrapped.  Two uses, neither of
  # them "success": it stops the pre-wrap disturbance penalty (moving a wrapped
  # object is the goal), and with criterion=geometric it is the gate.
  coverage_target_rad: 3.0019 # 172 deg
  tug:
    # Wrap angle at which the pull is attempted.  Deliberately permissive, for
    # the same reason as the lift's: gating it on the coverage target would
    # make the wrap angle the objective again by the back door, since nothing
    # would ever be pulled until the geometry gate was met and retention could
    # never fail informatively.
    trigger_rad: 2.0944       # 120 deg
    # Lateral force as a multiple of the object's weight (m*g), so the pull
    # follows the randomised mass instead of being a picked number.
    #
    # It has to clear the floor.  The object stands on the ground, so a lateral
    # pull fights friction before it fights the grasp, and friction alone holds
    # up to mu times the weight -- 1.2x at the top of the configured range.
    # At 1x the test is void: measured on a 0.30 kg cylinder, an *unwrapped*
    # object moves 1.2 mm under 1x and would pass retention outright.  At 2x it
    # slides 662 mm and at 3x, 727 mm, while the wrap holds it to 9 mm of the
    # arm at every multiple up to 4x.  3x leaves the friction bound a factor of
    # 2.5 behind without asking more of the grasp than it can give.
    force_scale: 3.0
    # 3 macro steps at the default 40 substeps.
    hold_substeps: 120
    max_rel_translation_m: 0.03
    max_rel_rotation_rad: 0.5
  lift:
    # Wrap angle at which the scripted lift is attempted.  Deliberately
    # permissive: an attempt costs a few substeps, and letting the policy try
    # early and fail retention is more informative than never trying.
    trigger_rad: 2.0944       # 120 deg
    # Lifting this arm means rotating roll so the bend plane goes from
    # horizontal to vertical.  The object lying down ~90 deg is expected;
    # uprightness is NOT part of the success test.
    # Roll angle that puts the bend plane vertical, which is what lifting
    # means for this arm.  Measured: roll = 0 gives a vertical bend plane and
    # roll = +/-90 deg a horizontal one, and the wrap forms in the horizontal
    # one.  So the lift rotates *to* zero.  Targeting +90 deg from a wrap at
    # -90 deg would sweep 180 deg and unwrap the object on the way.
    roll_target_rad: 0.0
    roll_rate_rad_per_substep: 0.01
    hold_substeps: 100
    # Retention: the object must not fall and must keep its pose relative to
    # segment 2 within these tolerances for the whole lift plus hold.
    max_rel_translation_m: 0.03
    max_rel_rotation_rad: 0.5
    min_height_m: 0.02

observation:
  # Rule 2: the actor never sees simulator ground truth.
  actor:
    include_joint_estimate: true
    include_object_geometry: true   # (r, height, base-frame pose)
    include_load_proxy: true        # previous-step joint torque proxy
    include_step_index: true
    noise:
      joint_rad: 0.005
      object_pos_m: 0.004
      object_rot_rad: 0.02
      load_proxy: 0.02
    # Macro-step observation delay drawn uniformly from this inclusive range.
    delay_steps: [0, 2]
  critic_privileged:
    include_true_joint_state: true
    include_contact_forces: true
    include_true_object_pose: true
    include_coverage: true

domain_randomisation:
  enable: true
  friction: [0.6, 1.2]
  # Capped at the arm's payload.  This is a continuum backbone, not a rigid
  # manipulator: kilogram loads are outside what it can hold, and the beta
  # residual model is identified over the same light range.
  #
  # It also has to stay light for the wrap to close at all.  The coil's inner
  # clearance exceeds a 90 mm cylinder by about 5 mm, so closing on the small
  # end of the size range means nudging the object into contact, and a heavy
  # object will not be nudged: at 45 mm radius the wrap reaches 174 deg at
  # 1.0 kg and stalls at 70 deg at 2.0 kg.
  object_mass_kg: [0.15, 0.50]
  # Lower bound raised from 35 mm: at that size the coil closes past the
  # cylinder without reaching it -- one contact, zero wrap -- so those episodes
  # were unwinnable rather than hard.
  object_radius_m: [0.045, 0.060]
  object_pos_jitter_m: [0.03, 0.03, 0.01]
  object_yaw_jitter_rad: 0.35

curriculum:
  # Rule: switchable by config, not by code edits.
  #
  # Every stage scores retention under a pull.  See `success.criterion` for
  # why neither the wrap angle nor the lift test is the objective.  Both remain
  # selectable per stage.
  #
  # Stage 2: a policy trained through stage 1 reached 18.5% success at the one
  # placement it had seen and 9.6% at +/-30 mm offsets, which stage 1 holds
  # fixed.  Stage 2 randomises the placement.
  stage: 2
  stages:
    1:
      randomise_object_pose: false
      randomise_object_radius: false
      approach_shaping: true
      success_criterion: tug
    2:
      randomise_object_pose: true
      randomise_object_radius: false
      # Kept on, against the original design.  Approach shaping is the only
      # dense signal that gets the arm to the object at all, and every run
      # without an effective one ended with the policy never touching it.
      # Turning it off at the same time as switching on pose randomisation
      # would change two things at once and leave a failure unattributable;
      # dropping it is worth testing, but on its own.
      approach_shaping: true
      success_criterion: tug
    3:
      randomise_object_pose: true
      randomise_object_radius: true
      approach_shaping: false
      success_criterion: tug

# Reverse curriculum on where the arm starts.
#
# The success bonus had never once been paid.  Over roughly 50,000 episodes to
# iteration 100 it never fired and the wrap angle stayed at zero, so the
# objective contributed nothing to the gradient and the policy was shaped
# entirely by the dense proxies -- each of which has a degenerate optimum two or
# three macro steps from Home, which is why four successive runs each converged
# on a different worthless behaviour.  No further shaping repair fixes that; the
# bonus has to come inside reach of exploration.
start_pose:
  enable: true
  # The open coil already positioned around the object: where a scripted wrap is
  # at macro step 7, with the nearest link 78 mm off the surface and nothing
  # touching.  From here success is three or four steps away.
  near_waypoint: [-0.077, 1.5708, 0.0, 0.1047]
  # Interpolation from Home (0) to near_waypoint (1), sampled per env so one
  # rollout spans a spread of difficulties rather than a single point.
  t_range: [0.85, 1.0]
  # Once the success rate over `window` finished episodes clears advance_at, the
  # range moves `step` towards Home.  Keyed on evidence rather than on an
  # iteration count, so a policy that stops finishing stops advancing.  null
  # holds the range where it is, which is what to use to test whether the
  # near-goal task is learnable at all.
  advance_at: 0.5
  step: 0.1
  window: 512

train:
  max_iterations: 1500
  save_interval: 50
  experiment_name: wrap_grasp
  run_name: ""
  log_dir: sim/rl_runs
  resume: ""
  # Macro steps collected per env per PPO iteration.
  num_steps_per_env: 16
  # Handed to rsl_rl verbatim.  rsl_rl owns and validates this schema, so
  # mirroring it in typed dataclasses here would only create a second copy to
  # keep in sync across rsl_rl versions.  Matches rsl-rl-lib 5.4.x.
  runner:
    # Asymmetric actor-critic: the critic additionally sees the privileged
    # group (simulator truth), the actor never does.
    obs_groups:
      actor: [policy]
      critic: [policy, privileged]
    actor:
      class_name: rsl_rl.models.MLPModel
      hidden_dims: [256, 128, 64]
      activation: elu
      obs_normalization: true
      distribution_cfg:
        class_name: rsl_rl.modules.GaussianDistribution
        init_std: 0.5
        std_type: scalar
        learn_std: true
    critic:
      class_name: rsl_rl.models.MLPModel
      hidden_dims: [256, 128, 64]
      activation: elu
      obs_normalization: true
    algorithm:
      class_name: rsl_rl.algorithms.PPO
      value_loss_coef: 1.0
      use_clipped_value_loss: true
      clip_param: 0.2
      entropy_coef: 0.005
      num_learning_epochs: 5
      num_mini_batches: 4
      learning_rate: 0.0003
      schedule: adaptive
      gamma: 0.99
      lam: 0.95
      desired_kl: 0.01
      max_grad_norm: 1.0

benchmark:
  # T1 / gate G1.  Lower the sweep on memory-limited hosts; the script records
  # the first N that fails instead of pretending it ran.
  n_envs_sweep: [256, 1024, 4096, 8192]
  warmup_steps: 20
  measure_steps: 200
  # Drive the arm into a wrap before timing, so the measured rate reflects a
  # scene with live contacts rather than one merely capable of them.
  with_contact: true
  # (linear, roll, theta1, theta2) of the pose used for that, taken from the
  # workspace probe's peak at the configured object placement.
  wrap_pose: [0.0, -1.5708, 0.4712, 0.4712]
  out_path: sim/benchmarks/step_rate.md

eval:
  episodes_per_condition: 20
  # Conditions are *offsets* from the configured object centre, in metres, not
  # absolute positions.  Absolute values silently decouple from
  # support.center_xy: an earlier grid of x = 0.24/0.28/0.32 against a support
  # at x = 0.5 left the cylinder hanging 0.18 m off its post, so it fell on the
  # first step and all 13824 episodes scored as `topple` -- a result about
  # gravity, not about the policy.
  #
  # The object now stands on the floor, so an offset just moves where it
  # stands.  Ranges are kept near the training jitter (+/-0.03 m); far outside
  # it the policy is being asked about states it never saw.
  pose_offset_grid:
    x_m: [-0.03, 0.0, 0.03]
    y_m: [0.0]
    yaw_rad: [-0.3, 0.0, 0.3]
  # Matches the trainable range.  35 mm is excluded: the closed coil passes
  # that cylinder without reaching it -- one contact, zero wrap -- so scoring
  # it measures the arm's geometry, not the policy.
  radius_grid_m: [0.045, 0.050, 0.060]
  render_episodes: 1
  out_dir: sim/rl_runs/eval
