# Jetson profile: run host.py with real GO2 and camera.
[config]
extends = config.ini

[runtime]
use_gpu = false
use_hardware = true
host_ctrl_port = tcp://0.0.0.0:5558
host_sim_port = tcp://0.0.0.0:5566
host_feedback_port = tcp://0.0.0.0:5567
sim_camera_enable = false

[spawn]
go2_mount_offset_m = 0.35,0.0,0.08

[go2_hardware]
enabled = true
pose_source = sportmodestate
vel_feedback_enable = true
vel_feedback_kp_vx = 0.8
vel_feedback_kp_vy = 0.8
vel_feedback_kp_wz = 1.0
vel_feedback_max_vx = 0.6
vel_feedback_max_vy = 0.6
vel_feedback_max_wz = 1.0
vel_feedback_max_corr_vx = 0.15
vel_feedback_max_corr_vy = 0.15
vel_feedback_max_corr_wz = 0.25
vel_heading_hold_enable = true
vel_heading_hold_kp = 2.5
vel_heading_hold_ki = 0.4
vel_heading_hold_kd = 0.15
vel_heading_hold_max_wz = 0.5
vel_heading_hold_integral_max = 0.35
ros_workspace = ~/unitree_ros2
status_log_interval_s = 2.0

[perception]
run_local = true
provider = local
autostart = false
mode = camera
detector_config = model_presets/visual_servoing/detector.yolo.example.json
detector = config
target_label = sports ball
yolo_device = cuda:0
show_preview = false
preview_bind = tcp://0.0.0.0:5570
preview_jpeg_quality = 75
