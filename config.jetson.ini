# Jetson profile: run host.py with real GO2 and camera.
[config]
extends = config.ini

[runtime]
use_gpu = false
use_hardware = true
host_ctrl_port = tcp://0.0.0.0:5558
host_sim_port = tcp://0.0.0.0:5566
host_feedback_port = tcp://0.0.0.0:5567
sim_camera_enable = false
traj_lji_enable = true
traj_lji_duration_s = 0.12
traj_lji_min_s = 0.08
traj_lji_max_s = 0.18

[spawn]
go2_mount_offset_m = 0.35,0.0,0.08

[hardware]
u_offset_roll = -9.0
baudrate = 1000000
host_hw_cmd_hz = 50.0
current_read_hz = 5.0
arm_servo_thread_enable = true
arm_servo_thread_hz = 120.0
arm_latency_log_enable = true
arm_latency_log_interval_s = 1.0
arm_latency_log_path = engine/logs/arm_latency
profile_vel_seg1 = 150
profile_acc_seg1 = 20
profile_vel_seg2 = 150
profile_acc_seg2 = 20

[go2_hardware]
enabled = true
stand_on_start = none
gait_on_start = none
pose_source = sportmodestate
vel_feedback_enable = true
vel_feedback_kp_vx = 0.8
vel_feedback_kp_vy = 0.8
vel_feedback_kp_wz = 1.0
vel_feedback_max_vx = 0.6
vel_feedback_max_vy = 0.6
vel_feedback_max_wz = 1.0
vel_feedback_max_corr_vx = 0.15
vel_feedback_max_corr_vy = 0.15
vel_feedback_max_corr_wz = 0.25
vel_heading_hold_enable = true
vel_heading_hold_kp = 2.5
vel_heading_hold_ki = 0.4
vel_heading_hold_kd = 0.15
vel_heading_hold_max_wz = 0.5
vel_heading_hold_integral_max = 0.35
ros_workspace = ~/ros2_ws
status_log_interval_s = 0.0

[gaze_stabilizer]
gaze_walking_mode = pitch_preview

[pick]
mobile_gaze_mode = pitch_preview
mobile_handoff_distance_m = 0.30
lij_stall_steps = 8
lij_gain_scale_min = 0.25
lij_uv_priority_err = 0.30
lij_uv_priority_z_scale = 0.10
lij_uv_priority_cap_scale = 1.0
lij_approach_bias_uv_gate = 0.25
lij_measured_v_row_blend = 0.5
lij_measured_v_row_norm_max = 80.0
lij_dq_smooth_alpha = 0.45
lij_pipelined_motion = true
lij_step_period_s = 0.04
lij_command_horizon = 2.0
blind_micro_start_m = 0.06

[perception]
run_local = true
provider = local
autostart = false
mode = camera
detector_config = model_presets/visual_servoing/detector.real_green_hsv.json
detector = config
target_label = sports ball
yolo_device = auto
show_preview = false
preview_bind = tcp://0.0.0.0:5570
preview_jpeg_quality = 75
