# PC profile: run sim.py + ctrl.py, connect to the Jetson host.
[config]
extends = config.ini

[runtime]
use_hardware = true
host_ctrl_port = tcp://192.168.0.112:5558
host_sim_port = tcp://192.168.0.112:5566
host_feedback_port = tcp://192.168.0.112:5567
sim_camera_enable = true
sim_camera_auto_disable_unused = false

[spawn]
go2_mount_offset_m = 0.35,0.0,0.08
go2_teleop_vx_mps = 0.25
go2_teleop_vy_mps = 0.5
sim_target_enable = false

[go2_locomotion]
mirror_from_host = true

[perception]
run_local = false
provider = host
mode = camera
detector_config = model_presets/visual_servoing/detector.yolo.example.json
detector = config
target_label = sports ball
yolo_device = cuda:0
preview_endpoint = tcp://192.168.0.112:5570
