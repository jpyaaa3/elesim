schema_version: 1
extends: config.yaml
simulation:
  runtime:
    use_gpu: false
    use_hardware: true
  trajectory:
    lji:
      duration_s: 0.12
      max_s: 0.18
      min_s: 0.08
  cameras:
    hand_eye:
      enable: false
transport:
  host:
    control_endpoint: tcp://0.0.0.0:5558
    feedback_endpoint: tcp://0.0.0.0:5567
    simulation_endpoint: tcp://0.0.0.0:5566
robot:
  arm:
    hardware:
      arm_latency_log_enable: true
      arm_latency_log_path: logs/arm_latency
      arm_servo_thread_enable: true
      baudrate: 1000000
      current_read_hz: 5.0
      host_hw_cmd_hz: 50.0
      lji_velocity_accel_limit_deg_s2: 700.0
      lji_velocity_hold_max_s: 0.2
      lji_velocity_hold_s: 0.08
      lji_velocity_max_deg_s: 90.0
      lji_velocity_max_linear_deg_s: 60.0
      lji_velocity_max_roll_deg_s: 20.0
      lji_velocity_max_s1_deg_s: 75.0
      lji_velocity_max_s2_deg_s: 75.0
      lji_velocity_mode_enable: true
      profile_acc_seg1: 20
      profile_acc_seg2: 20
      profile_vel_seg1: 150
      profile_vel_seg2: 150
      u_offset_roll: -9.0
  go2:
    spawn:
      mount_offset_m:
      - 0.35
      - 0.0
      - 0.08
vision:
  perception:
    publishing:
      preview_bind: tcp://0.0.0.0:5570
    detector:
      detector_config: perception/detector.real_green_hsv.json
      target_label: sports ball
    runtime:
      mode: camera
      show_preview: false
behaviors:
  pick:
    lji:
      bad_motion_reacquire_steps: 3
      dq_smooth_alpha: 0.45
      far_linear_cap_m: 0.01
      far_z_gain: 0.3
      gain_scale_min: 0.25
      gain_v: 0.8
      gain_z: 0.6
      max_dq_linear: 0.004
      max_dq_roll: 0.0005
      max_dq_theta1: 0.006
      measured_v_row_blend: 0.25
      measured_v_row_norm_max: 80.0
      obs_camera_jump_m: 0.12
      obs_max_camera_z_m: 0.8
      obs_remain_jump_m: 0.08
      pipelined_motion: true
      sample_cmd_meas_cos_min: 0.25
      sample_meas_cmd_ratio_max: 2.0
      sample_meas_cmd_ratio_min: 0.15
      step_period_s: 0.04
      uv_priority_err: 0.18
      uv_priority_z_scale: 0.0
    general:
      blind_micro_start_m: 0.06
