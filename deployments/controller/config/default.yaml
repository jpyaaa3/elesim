schema_version: 1
extends: config.yaml
simulation:
  runtime:
    use_hardware: true
  cameras:
    hand_eye:
      auto_disable_unused: false
transport:
  host:
    control_endpoint: tcp://192.168.0.112:5558
    feedback_endpoint: tcp://192.168.0.112:5567
    simulation_endpoint: tcp://192.168.0.112:5566
robot:
  arm:
    hardware:
      u_offset_roll: -9.0
  go2:
    spawn:
      mount_offset_m:
      - 0.35
      - 0.0
      - 0.08
    teleop:
      vx_mps: 0.25
      vy_mps: 0.5
    locomotion:
      general:
        mirror_from_host: true
world:
  target:
    enable: false
vision:
  perception:
    publishing:
      preview_endpoint: tcp://192.168.0.112:5570
    detector:
      detector_config: config/perception/detector.yolo.example.json
      target_label: sports ball
    runtime:
      mode: camera
      provider: host
      run_local: false
      show_preview: false
behaviors:
  pick:
    mobile:
      gaze_mode: uv
  gaze:
    general:
      walking_gaze_mode: uv
