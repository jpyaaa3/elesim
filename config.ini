[runtime]
use_gpu = true
use_go2 = false
use_hardware = true
host_ctrl_port = tcp://127.0.0.1:5555
host_sim_port = tcp://127.0.0.1:5556
host_feedback_port = tcp://127.0.0.1:5557
hand_eye_config = configs/hand_eye.node9_mount.json
show_all_ports = false
# Host-side quintic joint trajectory (q_start -> q_goal)
traj_enable = true
traj_duration_s = 0.8
traj_min_s = 0.15
traj_max_s = 1.5
traj_linear_scale_m = 0.05
traj_angular_scale_rad = 0.35
# LJI visual servo: short quintic between dq steps (smooth vs stop-and-go)
traj_lji_enable = true
traj_lji_duration_s = 0.14
traj_lji_min_s = 0.07
traj_lji_max_s = 0.35

[hardware]
# linear, roll, seg1, seg2
command_direction = -1, -1, 1, -1
motor_direction = -1, -1, 1, -1
current_yellow_ma = 1800
current_limit_ma = 2500

[model]
rebuild_robot = true
roll_min_deg = -90.0
roll_max_deg = 90.0
bend_deg = 36.0

[spawn]
spawn_position = 0.0,0.0,1.0
spawn_orientation_deg = 0.0,0.0,0.0
draw_debug_markers = true

[perception]
enabled = true
detector_config = addons/autonomous_pick_place_app/configs/detector.yolo.example.json
mode = camera
detector = config
target_label = sports ball
yolo_device =
publish_hz = 60.0
show_preview = true
pipeline = yolo_seg
tracker = csrt
track_lost_frames = 15
reacquire_on_lost = true
# TRACK watchdog: re-run YOLO when scale/bbox stalls (intermittent CSRT shrink)
track_scale_min = 0.05
track_scale_stale_eps = 0.002
track_redetect_stale_frames = 20
track_bbox_shrink_ratio = 0.55
track_init_bbox_padding = 1.0
track_watchdog_min_frames = 8
# CSRT lower sensitivity (OpenCV defaults: psr~0.035, scale_lr~0.002, padding~3)
track_csrt_psr_threshold = 0.045
track_csrt_scale_lr = 0.003
track_csrt_histogram_lr = 0.002
track_csrt_padding = 0.0
track_csrt_scale_step = 1.0
# bbox EMA during TRACK: 0=off, 0.65=slow follow, 0.85=very smooth
track_bbox_smooth_alpha = 0.85
# yolo_seg: CSRT coast when YOLO misses (shift last mask, no bbox rectangle publish)
track_aux_csrt = true
track_coast_max_frames = 12
# close range: lighter mask erode + easier YOLO refresh when scale stalls
track_proximity_scale = 0.12
track_proximity_mask_erode_px = 0
track_redetect_grow_ratio = 1.12
track_redetect_grow_ratio_stale = 1.03

[pick]
enabled = true
# 2x2 grid cell (col=1, row=0) = top-right; row 0 = top
grid_cols = 2
grid_rows = 2
target_grid_col = 1
target_grid_row = 0
# align: u = right-half center (+0.5), v = image vertical center (0.0)
target_uv_u = 0.1
target_uv_v = 0.1
# approach done when mask area / full frame >= target_scale (tuned ~quadrant 64% fill)
quadrant_fill_min = 0.80
target_scale = 0.16
scale_tol = 0.02
# UV deadband for full pick: |du|,|dv| below this → center_ok
center_tol = 0.16
# Aim-only: tighter centroid alignment before equal-sag (must be <= center_tol)
aim_center_tol = 0.02
# pick centering only (visual search still uses actions.py defaults)
center_u_gain = 12.0
center_v_gain = 12.0
center_roll_max = 6.0
center_seg_max = 6.0
center_error_scale_max = 3.5
# scale_ok but UV not improving → latch approach (avoid 200-step center loop)
center_stuck_iters = 30
center_stuck_max_uv = 0.14
# rough pre-grasp offset from object world coordinate along -target_dir
ready_pose_standoff_m = 0.20
# auto-search feasible ready dir via view-pregrasp grid when user dir is not IK-achievable
ready_pose_resolve_dir = true
ready_pose_max_dir_error_deg = 3.0
# post-aim corrected ready: accept best-effort dir when strict 10deg gate misses (e.g. 12.9deg)
ready_pose_corrected_max_dir_error_deg = 3.0
ready_pose_skip_search_under_deg = 5.0
ready_pose_lateral_offsets_m = -0.05,0,0.05
ready_pose_height_offsets_m = 0,0.05,0.10
ready_pose_look_dot_min = 0.85
# Ready Pose IK (Look-grade direction; separate from visual pick ik_align_*)
ready_pose_align_mode = full
ready_pose_align_skip_under_deg = 3.0
ready_pose_align_top_k = 3
# after Aim equal-sag accepted: IK move tip to centered object (skip Ready/Pick)
auto_grasp_after_aim = false
# grasp IK target: object minus approach_dir * standoff (default 5 cm before object)
grasp_standoff_m = 0.02
# guided grasp: waypoint UV+sag correction, then blind final approach
grasp_guided_enabled = true
grasp_waypoint_step_m = 0.05
# axial remain at/below this: switch to blind (was 0.10; 3-5cm typical)
grasp_guided_handoff_m = 0.04
# blind: keep mask/UV tracking; freeze depth (do not stop perception)
grasp_blind_uv_only = true
# EMA alpha for grasp object_world / approach_dir (0=hold, 1=raw measurement)
grasp_object_filter_alpha = 0.25
grasp_approach_filter_alpha = 0.20
# legacy (unused): blind is one-shot extend after handoff look latch
grasp_blind_start_m = 0.1
grasp_blind_approach_m = 0.1
grasp_max_waypoints = 2000
# dwell after q settled; motion_timeout = max wait for host q before next wp
grasp_waypoint_settle_s = 0.1
grasp_waypoint_settle_timeout_s = 1.0
# guided grasp: FK look-at drift gate on waypoint IK
grasp_waypoint_max_dir_error_deg = 5.0
grasp_waypoint_max_approach_drift_deg = 12.0
# 0 = use aim_center_tol; set explicitly to override (e.g. 0.03)
grasp_uv_center_tol = 0.0
# legacy guided IK waypoint loop only (ignored during LJI visual servo)
grasp_online_sag_enabled = true
grasp_online_sag_max_step_deg = 2.0
# sag drift: FK axis projection + dir gate before equal-sag LSQ
# lateral gate applies only when sag_drift_axial_only = false
sag_drift_max_dir_error_deg = 18.0
sag_drift_max_lateral_m = 0.1
sag_drift_axial_only = true
# sim/mock: skip post-IK UV aim recover (no real camera feedback loop)
grasp_skip_aim_recover_in_mock = true
# Local image Jacobian grasp (LJI path); false = legacy axial IK waypoint loop
local_img_jacobian_enabled = true
lij_window_size = 8
lij_min_samples = 4
lij_damping = 0.05
lij_gain_u = 0.35
lij_gain_v = 0.35
lij_gain_z = 0.45
lij_z_bend_gain = 0.2
# Inner seg1 (shoulder) has larger tip leverage — lower J coupling and dq cap vs seg2 (elbow).
lij_seg1_jacobian_scale = 1.0
lij_seg2_jacobian_scale = 1.0
lij_max_dq_theta1 = 0.004
# 0 = disabled; only abort when a hard joint limit is hit and remain stalls (not soft joint_saturated).
lij_stall_steps = 0
lij_stall_remain_eps_m = 0.005
lij_joint_limit_margin_m = 0.001
lij_joint_limit_margin_rad = 0.002
# deprecated: LJI path does not run online sag (legacy guided IK only)
lij_sag_min_lateral_m = 0.015
lij_depth_settled_remain_delta_m = 0.005
lij_max_dq_linear = 0.002
lij_max_dq_angle = 0.012
# remain > handoff: larger linear cap only; seg1/seg2 stay in LJI (task-priority z then uv)
lij_uv_handoff_m = 0.10
lij_far_linear_cap_m = 0.010
lij_far_z_gain = 0.20
# gain scale: 1.0 at ref distance, down to min near close_tol (reduces near-range oscillation)
lij_gain_scale_ref_m = 0.30
lij_gain_scale_min = 0.12
# LJI continuous motion: 0 dwell + 0 settle wait (legacy guided loop still uses grasp_waypoint_settle_s)
lij_settle_dwell_s = 0.0
lij_settle_timeout_s = 0.0
# pipelined LJI: immediate lji_step apply (no quintic); blocking settle uses traj_lji
# lij_dq_smooth_alpha > 0 low-pass filters dq; 0 = off. Does not fix pipelined alone.
lij_dq_smooth_alpha = 0.3
lij_pipelined_motion = true
lij_step_period_s = 0.06
lij_condition_max = 100.0
lij_probing_enabled = false
lij_probing_epsilon_linear = 0.001
lij_probing_epsilon_angle = 0.01
# deprecated (2D LJI only; ignored when 3D LJI active):
# lij_uv_align_tol = 0.04
# lij_approach_bias_gain = 0.3
# lij_approach_seed_mode = config
# lij_approach_seed_q_delta = 0,0,0.01,0.01
# lij_approach_seed_travel_m = 0.003
# blind_micro_start_m = 0.025
lij_sample_min_dq_norm = 0.0005
# remain <= this → LJI 종료, one-shot blind axial 후 gripper close
blind_micro_start_m = 0.1
grasp_close_tol_m = 0.003
lij_depth_invalid_frames = 3
lij_depth_valid_ratio_min = 0.6
lij_depth_std_max_m = 0.012
lij_depth_unstable_threshold_m = 0.06
lij_reacquire_max_steps = 8
lij_reacquire_aim_after_steps = 4
lij_reacquire_remain_fail_m = 0.08
lij_reacquire_retrace_gain = 1.0
lij_reacquire_axial_step_m = 0.012
lij_reacquire_v_err_m = 0.45
# Look pose: move to feasible view pregrasp (tip looks at object)
look_pose_standoff_m = 0.30
look_pose_resolve_dir = true
look_pose_max_dir_error_deg = 10.0
look_pose_skip_search_under_deg = 5.0
look_pose_lateral_offsets_m = -0.05,0,0.05
look_pose_height_offsets_m = 0,0.05,0.10
look_pose_look_dot_min = 0.85
# Look grid: position-only screen all candidates, then full align top-K winners
look_pose_align_top_k = 3
# after Look IK: sag often drops object from FOV — re-aim then UV center before Grasp
look_post_sag_trim_enabled = true
look_post_uv_recover_enabled = true
look_post_uv_max_steps = 30
look_post_uv_center_tol = 0.05
look_post_uv_acquire_s = 2.5
# IK direction refine: lite = single TRF from position seed; full = seed-bank search
ik_align_mode = lite
ik_align_skip_under_deg = 10.0
ik_align_rounds = 4
# after align+approach: advance gripper 9 cm along EE local -Z (IK), holding target UV
approach_extend_m = 0.09
# legacy; extend is one-shot (full approach_extend_m per solve_then_align)
approach_extend_step_m = 0.09
linear_step_u = 2.0
linear_gain = 40.0
max_iters = 200
require_track_frames = 3
acquire_timeout_s = 30.0
# center phase: force approach / fail when scale stays far below target
scale_stuck_iters = 40
scale_stuck_ratio = 0.5
# extend when center_ok AND scale_ok (or scale plateau at target); not by step count alone
approach_scale_plateau_iters = 25
approach_scale_plateau_eps = 0.004
# legacy keys (unused for extend gate; kept for scale_stuck / docs)
approach_min_scale = 0.09
approach_min_steps = 50
approach_loose_center_tol = 0.10

[colors]
plate = #a0a0a0
housing = #151515
wedge = #383838
node0 = #707070
node1 = #707070
node2 = #707070
node3 = #707070
node4 = #707070
node5 = #707070
node6 = #707070
node7 = #707070
node8 = #707070
node9 = #707070
gripper_base = #383838
gripper_claw_left = #383838
gripper_claw_right = #383838
