[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-router"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["elesim-protocol==0.2.0", "pyzmq>=27,<28", "PyYAML>=6,<7"]

[project.scripts]
elesim-router = "elesim_router.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
