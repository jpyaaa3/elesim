<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EleSim Live Code Map</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>EleSim Live Code Map</h1>
    <span id="status">분석 중</span>
  </header>
  <main>
    <aside class="controls">
      <label>검색 <input id="search" type="search" placeholder="symbol / path"></label>
      <label>역할 <select id="role"><option value="">전체</option></select></label>
      <label>깊이 <select id="depth"><option value="module">모듈</option><option value="class">클래스</option><option value="function">함수/메서드</option></select></label>
      <label>변경 <select id="change"><option value="">전체</option><option>added</option><option>modified</option><option>deleted</option><option>unchanged</option></select></label>
      <label>워크플로 <select id="workflow"><option value="">전체</option></select></label>
      <label><input id="staticEdges" type="checkbox" checked> 정적 edge</label>
      <label><input id="observedEdges" type="checkbox" checked> 관측 edge</label>
      <button id="traces">Jaeger 불러오기</button>
      <button id="fit">화면 맞춤</button>
      <p id="summary"></p>
      <p class="legend"><i class="added"></i>추가 <i class="modified"></i>수정 <i class="deleted"></i>삭제 <i class="unparsed"></i>파싱 실패</p>
    </aside>
    <section id="viewport"><svg id="graph"><g id="scene"><g id="groups"></g><g id="edges"></g><g id="nodes"></g></g></svg></section>
    <aside id="detail"><h2>노드를 선택하십시오</h2><div id="meta"></div><h3>Source</h3><pre id="source"></pre><h3>HEAD diff</h3><pre id="diff"></pre></aside>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
