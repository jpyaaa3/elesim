<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EleSim Live Code Map</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>EleSim Live Code Map</h1>
    <span id="status">분석 중</span>
  </header>
  <main>
    <aside class="controls">
      <label>검색 <input id="search" type="search" placeholder="symbol / path"></label>
      <label>역할 <select id="role"><option value="">전체</option></select></label>
      <label>깊이 <select id="depth"><option value="module">모듈</option><option value="class">클래스</option><option value="function">함수/메서드</option></select></label>
      <label>변경 <select id="change"><option value="">전체</option><option>added</option><option>modified</option><option>deleted</option><option>unchanged</option></select></label>
      <label>플로우 가족 <select id="flow-family"><option value="">전체</option></select></label>
      <label>워크플로 <select id="workflow"><option value="">전체</option></select></label>
      <label>표현 수준 <select id="flow-view"><option value="overview">개요</option><option value="spine" selected>실행 흐름</option><option value="full">전체 근거</option></select></label>
      <label>탐색 방향 <select id="direction"><option value="both">양방향</option><option value="downstream">후속 경로</option><option value="upstream">선행 경로</option></select></label>
      <label>Jaeger service <select id="jaeger-service"><option value="">전체 서비스</option></select></label>
      <label>Jaeger operation <select id="jaeger-operation"><option value="">전체 operation</option></select></label>
      <label>Jaeger trace <select id="jaeger-trace"><option value="">관측 순서 없음</option></select></label>
      <label><input id="hideTests" type="checkbox" checked> 테스트 코드 숨기기</label>
      <label><input id="staticEdges" type="checkbox" checked> 정적 edge</label>
      <label><input id="observedEdges" type="checkbox" checked> 관측 edge</label>
      <button id="traces">Jaeger 불러오기</button>
      <button id="mock-ui-toggle" aria-expanded="false">Mock UI 열기</button>
      <button id="collapse-all">세부 호출 다시 접기</button>
      <button id="fit">화면 맞춤</button>
      <p id="summary"></p>
      <p id="flow-info" class="flow-info">플로우를 선택하면 START에서 상→하로 입력·출력·분기·루프를 펼칩니다. 주황색 선은 방향성 경로입니다.</p>
      <p class="legend"><i class="added"></i>추가 <i class="modified"></i>수정 <i class="deleted"></i>삭제 <i class="unparsed"></i>파싱 실패</p>
    </aside>
    <section id="viewport">
      <aside id="mock-ui" hidden aria-label="UI Workflow Explorer">
        <div class="mock-ui-heading"><div><strong>UI Workflow Explorer</strong><small>정적 탐색 전용 · 실제 명령은 실행되지 않음</small></div><button id="mock-ui-close" type="button" aria-label="닫기">×</button></div>
        <div id="mock-ui-summary"></div>
        <div id="mock-ui-content"></div>
      </aside>
      <svg id="graph"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker><marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z"></path></marker></defs><g id="scene"><g id="groups"></g><g id="edges"></g><g id="nodes"></g></g></svg>
    </section>
    <aside id="detail"><h2>노드를 선택하십시오</h2><div id="meta"></div><h3>Source</h3><pre id="source"></pre><h3>HEAD diff</h3><pre id="diff"></pre></aside>
  </main>
  <script src="/vendor/elk.bundled-0.9.3.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
