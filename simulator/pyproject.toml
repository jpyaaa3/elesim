[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-simulator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "elesim-protocol==0.1.0",
  "numpy>=1.26,<2",
  "scipy>=1.11",
  "pyzmq>=27,<28",
  "PyYAML>=6,<7",
  "genesis-world>=0.4.7",
]

[project.optional-dependencies]
video = ["aiortc>=1.9,<2", "av>=12,<16"]
mpc = ["casadi>=3.6", "pin>=3.0"]
test = ["pytest>=8,<9"]

[project.scripts]
elesim-simulator = "elesim_simulator.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
