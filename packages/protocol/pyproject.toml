[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-protocol"
version = "0.3.0"
description = "Protocol v6 direct ROS 2/DDS peer contracts for EleSim nodes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2"]

[project.optional-dependencies]
observability = [
  "opentelemetry-api>=1.25,<2",
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
