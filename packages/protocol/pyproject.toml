[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elesim-protocol"
version = "0.2.0"
description = "Protocol v4 and secure ZMQ transport for Elesim nodes"
requires-python = ">=3.10"
dependencies = ["numpy>=1.23,<2", "pyzmq>=27,<28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
