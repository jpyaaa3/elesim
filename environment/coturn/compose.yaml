services:
  coturn:
    image: coturn/coturn:4.14.0-r0-alpine
    container_name: elesim-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "49160-49200:49160-49200/udp"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --realm=${TURN_REALM:?TURN_REALM is required}
      - --external-ip=${TURN_PUBLIC_IP:?TURN_PUBLIC_IP is required}
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET:?TURN_STATIC_AUTH_SECRET is required}
    tmpfs:
      - /var/lib/coturn
