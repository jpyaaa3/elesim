schema_version: 1
extends: null

# Select one deployment profile here.  Installed overlays may override this
# value without copying the complete application configuration.
mode: pc

# Shared values below are deliberately kept outside these sections.  A
# profile only contains the settings that differ on that host/runtime.
# ---- Profile-specific overrides ------------------------------------------
profiles:
  # Laptop/desktop Pilot: local camera perception and hardware-shaped control.
  pc:
    simulation:
      runtime:
        use_hardware: true
      cameras:
        hand_eye:
          auto_disable_unused: false
    robot:
      arm:
        hardware:
          u_offset_roll: -9.0
      go2:
        spawn:
          mount_offset_m: [0.35, 0.0, 0.08]
        teleop:
          vx_mps: 0.25
          vy_mps: 0.5
    world:
      target:
        enable: false
    vision:
      perception:
        detector:
          detector_config: perception/detector.yolo.example.json
          target_label: sports ball
        runtime:
          mode: camera
          provider: host
          run_local: false
          show_preview: false
    behaviors:
      pick:
        mobile:
          gaze_mode: uv
      gaze:
        general:
          walking_gaze_mode: uv

  # Jetson/native Pilot: serial arm, camera perception and conservative LJI.
  jetson:
    simulation:
      runtime:
        use_gpu: false
        use_hardware: true
      trajectory:
        lji:
          duration_s: 0.12
          max_s: 0.18
          min_s: 0.08
      cameras:
        hand_eye:
          enable: false
    robot:
      arm:
        hardware:
          arm_latency_log_enable: true
          arm_latency_log_path: logs/arm_latency
          arm_servo_thread_enable: true
          baudrate: 1000000
          current_read_hz: 5.0
          host_hw_cmd_hz: 50.0
          lji_velocity_accel_limit_deg_s2: 700.0
          lji_velocity_hold_max_s: 0.2
          lji_velocity_hold_s: 0.08
          lji_velocity_max_deg_s: 90.0
          lji_velocity_max_linear_deg_s: 60.0
          lji_velocity_max_roll_deg_s: 20.0
          lji_velocity_max_s1_deg_s: 75.0
          lji_velocity_max_s2_deg_s: 75.0
          lji_velocity_mode_enable: true
          profile_acc_seg1: 20
          profile_acc_seg2: 20
          profile_vel_seg1: 150
          profile_vel_seg2: 150
          u_offset_roll: -9.0
      go2:
        spawn:
          mount_offset_m: [0.35, 0.0, 0.08]
    vision:
      perception:
        detector:
          detector_config: perception/detector.real_green_hsv.json
          target_label: sports ball
        runtime:
          mode: camera
          show_preview: false
    behaviors:
      pick:
        lji:
          bad_motion_reacquire_steps: 3
          dq_smooth_alpha: 0.45
          far_linear_cap_m: 0.01
          far_z_gain: 0.3
          gain_scale_min: 0.25
          gain_v: 0.8
          gain_z: 0.6
          max_dq_linear: 0.004
          max_dq_roll: 0.0005
          max_dq_theta1: 0.006
          measured_v_row_blend: 0.25
          measured_v_row_norm_max: 80.0
          obs_camera_jump_m: 0.12
          obs_max_camera_z_m: 0.8
          obs_remain_jump_m: 0.08
          pipelined_motion: true
          sample_cmd_meas_cos_min: 0.25
          sample_meas_cmd_ratio_max: 2.0
          sample_meas_cmd_ratio_min: 0.15
          step_period_s: 0.04
          uv_priority_err: 0.18
          uv_priority_z_scale: 0.0
        general:
          blind_micro_start_m: 0.06

# ---- Shared application defaults -----------------------------------------
simulation:
  physics:
    bend_rate: .inf
    dt: 0.02
    gravity:
    - 0.0
    - 0.0
    - 0.0
    realtime: true
    realtime_factor: 1.0
    roll_rate: .inf
    substeps: 1
    queue_depth: 1
  runtime:
    enable_viewer: true
    floor: true
    show_all_ports: false
    use_go2: true
    use_gpu: true
    use_hardware: false
  assembly:
    arm_urdf_name: arm.urdf
    assy_build_json: blueprint.json
    build_dir: .model-build
    rebuild_assembly: true
    urdf_name: robot.urdf
  trajectory:
    default:
      angular_scale_rad: 0.35
      duration_s: 0.8
      enable: true
      linear_scale_m: 0.05
      max_s: 1.5
      min_s: 0.15
    lji:
      duration_s: 0.14
      enable: true
      max_s: 0.35
      min_s: 0.07
  cameras:
    hand_eye:
      profile: zed_mini
      config: calibration/zed_mini.hand_eye.json
      auto_disable_unused: true
      depth: true
      enable: true
      fov_deg: 60.0
      height: 480
      jpeg: true
      jpeg_quality: 75
      max_hz: 30.0
      topic: /elesim/sim/rgbd/frame
      rgb: true
      width: 640
    observer:
      enable: true
      fov_deg: 60.0
      height: 480
      jpeg: true
      jpeg_quality: 85
      lookat:
      - 0.45
      - 0.0
      - 0.25
      max_hz: 20.0
      stream: webrtc://elesim/sim-default/observer
      pos:
      - 0.45
      - -1.8
      - 1.8
      record_fps: 30.0
      width: 640
  performance:
    log_enable: false
    log_interval_s: 2.0
    log_path: ''
robot:
  arm:
    hardware:
      arm_latency_log_enable: false
      arm_latency_log_interval_s: 1.0
      arm_latency_log_path: ''
      arm_servo_thread_enable: false
      arm_servo_thread_hz: 120.0
      baudrate: 57600
      command_direction:
