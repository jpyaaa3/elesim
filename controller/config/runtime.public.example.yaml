schema_version: 3
runtime:
  role: controller
  endpoint_id: controller-main
  active_target: sim-default
dds:
  system_id: elesim
  node_key: controller-main
  domain_id: 0
  rmw_implementation: rmw_cyclonedds_cpp
  discovery_mode: static
  static_peers: [10.8.0.2]
  network_interface: wg0
  vendor_config: /etc/elesim/cyclonedds.xml
  security_profile: sros2
  keystore: /etc/elesim/keystore
  enclave: /elesim/controller-main
