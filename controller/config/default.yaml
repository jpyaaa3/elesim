schema_version: 1
extends: config.yaml
simulation:
  runtime:
    use_hardware: true
  cameras:
    hand_eye:
      auto_disable_unused: false
robot:
  arm:
    hardware:
      u_offset_roll: -9.0
  go2:
    spawn:
      mount_offset_m:
      - 0.35
      - 0.0
      - 0.08
    teleop:
      vx_mps: 0.25
      vy_mps: 0.5
world:
  target:
    enable: false
vision:
  perception:
    detector:
      detector_config: perception/detector.yolo.example.json
      target_label: sports ball
    runtime:
      mode: camera
      provider: host
      run_local: false
      show_preview: false
behaviors:
  pick:
    mobile:
      gaze_mode: uv
  gaze:
    general:
      walking_gaze_mode: uv
